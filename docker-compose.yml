# ---------------------------------------------------------------------------
# Odoo Atlas — local development stack.
#
# Four services, one PostgreSQL cluster with two logical databases:
#   postgres      PostgreSQL 17 + pgvector 0.8   → databases `odoo` and `atlas`
#   odoo          Odoo 19 CE + the odoo_atlas addon (mounted from ./addons)
#   atlas-api     The retrieval/orchestration engine (FastAPI)
#   atlas-worker  Drains the ingestion queue
#
# The engine runs beside Odoo rather than inside it — see ADR-0002.
#
# This file is development-oriented: source is bind-mounted for live reload and
# ports are published to the host. A hardened production overlay ships in M14.
# ---------------------------------------------------------------------------
name: odoo-atlas

x-atlas-environment: &atlas-environment
  ATLAS_ENV: ${ATLAS_ENV:-development}
  ATLAS_LOG_LEVEL: ${ATLAS_LOG_LEVEL:-INFO}
  ATLAS_DATABASE__URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${ATLAS_DB_NAME:-atlas}
  # Defaults are the offline providers so the stack starts without an account.
  # See .env.example for switching to a real vendor.
  #
  # The keys accept `ATLAS_*` first and fall back to the vendor-specific names.
  # Mapping them only from `ANTHROPIC_API_KEY` and `OPENAI_API_KEY` worked for
  # the two vendors that were anticipated and silently broke for anything else:
  # setting `ATLAS_CHAT__API_KEY` in `.env` had no effect, the container
  # received an empty string, and the engine refused to start with "no API key
  # configured" — pointing at a variable that was, in fact, set.
  #
  # `BASE_URL` is what reaches any OpenAI-compatible host: Azure, Google's
  # compatibility endpoint, or something self-hosted.
  ATLAS_CHAT__VENDOR: ${ATLAS_CHAT__VENDOR:-fake}
  ATLAS_CHAT__MODEL: ${ATLAS_CHAT__MODEL:-fake-model}
  ATLAS_CHAT__API_KEY: ${ATLAS_CHAT__API_KEY:-${ANTHROPIC_API_KEY:-}}
  ATLAS_CHAT__BASE_URL: ${ATLAS_CHAT__BASE_URL:-}
  ATLAS_EMBEDDING__VENDOR: ${ATLAS_EMBEDDING__VENDOR:-hash}
  ATLAS_EMBEDDING__MODEL: ${ATLAS_EMBEDDING__MODEL:-hash-embedding-v1}
  ATLAS_EMBEDDING__DIMENSIONS: ${ATLAS_EMBEDDING__DIMENSIONS:-1536}
  ATLAS_EMBEDDING__API_KEY: ${ATLAS_EMBEDDING__API_KEY:-${OPENAI_API_KEY:-}}
  ATLAS_EMBEDDING__BASE_URL: ${ATLAS_EMBEDDING__BASE_URL:-}
  # How the engine reaches Odoo to authorize what it retrieved (ADR-0006). The
  # database is named explicitly because these calls carry no session: the
  # adapter sends it as the X-Odoo-Database header.
  ATLAS_ODOO__BASE_URL: http://odoo:8069
  ATLAS_ODOO__DATABASE: ${ODOO_DB_NAME:-odoo}
  ATLAS_ODOO__SERVICE_TOKEN: ${ATLAS_SERVICE_TOKEN}
  # Bind-mounted source takes precedence over the wheel baked into the image.
  # Removing this variable makes the container run purely from the image.
  PYTHONPATH: /app/src

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    container_name: atlas-postgres
    restart: unless-stopped
    # Docker gives a container 64 MB of /dev/shm, and PostgreSQL uses shared
    # memory for parallel workers. A parallel HNSW build over a real corpus asks
    # for around a gigabyte and fails with "could not resize shared memory
    # segment ... No space left on device" — which reads like a disk problem and
    # is not one. Found by building an index over 50k vectors (M13).
    shm_size: 2gb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required — copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --encoding=UTF8
      # Consumed by our init script, not by the postgres image itself.
      ATLAS_DB_NAME: ${ATLAS_DB_NAME:-atlas}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs exactly once, on first cluster initialisation.
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      # Loopback only: convenient for psql and GUI clients, invisible to the LAN.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  odoo:
    build:
      context: .
      dockerfile: docker/odoo/Dockerfile
    image: odoo-atlas/odoo:dev
    container_name: atlas-odoo
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # These four names are dictated by the official Odoo entrypoint.
      HOST: postgres
      PORT: 5432
      USER: ${POSTGRES_USER}
      PASSWORD: ${POSTGRES_PASSWORD}
      # Consumed by our bootstrap wrapper (docker/odoo/bootstrap.sh).
      ODOO_DB_NAME: ${ODOO_DB_NAME:-odoo}
      ODOO_INIT_MODULES: ${ODOO_INIT_MODULES:-base}
      ODOO_LOAD_DEMO_DATA: ${ODOO_LOAD_DEMO_DATA:-true}
      # Read by the odoo_atlas addon. All of its configuration comes from the
      # environment rather than from ir.config_parameter, because the code that
      # reads it runs as whichever user asked a question — and reading a config
      # parameter needs system rights, which would put a sudo() on the request
      # path (addons/odoo_atlas/services/engine.py).
      ATLAS_ENGINE_URL: http://atlas-api:8000
      ATLAS_ENGINE_TIMEOUT: ${ATLAS_ENGINE_TIMEOUT:-60}
      ATLAS_CONTEXT_TOKEN_TTL: ${ATLAS_CONTEXT_TOKEN_TTL:-900}
      # Shared with the engine: proves a call on /atlas/api/... came from it.
      ATLAS_SERVICE_TOKEN: ${ATLAS_SERVICE_TOKEN:?ATLAS_SERVICE_TOKEN is required — see .env.example}
      # Odoo's alone. Signs the tokens naming the acting user, and is deliberately
      # NOT given to the engine: if the engine could mint one it could read as any
      # user it liked, which is the property ADR-0006 exists to protect.
      ATLAS_CONTEXT_SECRET: ${ATLAS_CONTEXT_SECRET:?ATLAS_CONTEXT_SECRET is required — see .env.example}
      # The Odoo user id ingestion reads as. It must hold
      # odoo_atlas.group_atlas_ingest; what it may read is what Atlas may index.
      ATLAS_INGEST_UID: ${ATLAS_INGEST_UID:-0}
    volumes:
      - odoo-filestore:/var/lib/odoo
      # Read-only: Odoo must never write to its own source.
      - ./addons:/mnt/extra-addons:ro
      - ./docker/odoo/odoo.conf:/etc/odoo/odoo.conf:ro
    ports:
      - "${ODOO_PORT:-8069}:8069"
    healthcheck:
      # /web/health needs no database, so this reports the server itself.
      #
      # Python rather than curl: the Odoo image does not ship curl, so the
      # previous check failed with "curl: not found" on every interval and the
      # container reported unhealthy for as long as it ran — while serving
      # requests perfectly. A health check that cannot run is worse than none,
      # because it looks like a diagnosis.
      test:
        - "CMD"
        - "python3"
        - "-c"
        - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8069/web/health', timeout=3).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  atlas-api:
    build:
      context: .
      dockerfile: docker/atlas/Dockerfile
      target: runtime
    image: odoo-atlas/atlas:dev
    container_name: atlas-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment: *atlas-environment
    volumes:
      # Development only — see PYTHONPATH above.
      - ./services/atlas/src:/app/src:ro
    command:
      - uvicorn
      - atlas.interfaces.http.app:app
      - --host=0.0.0.0
      - --port=8000
      - --reload
      - --reload-dir=/app/src
    ports:
      # Loopback only. The engine is an internal service (ADR-0002); the Odoo
      # container reaches it over the compose network as http://atlas-api:8000.
      - "127.0.0.1:${ATLAS_API_PORT:-8000}:8000"

  # Drains the ingestion queue. Separate from atlas-api because ingestion is the
  # cold path: a full sync runs for minutes and would otherwise compete with
  # answering questions for the same event loop. Scale it by running more of
  # them — `FOR UPDATE SKIP LOCKED` means two workers never take the same job.
  atlas-worker:
    build:
      context: .
      dockerfile: docker/atlas/Dockerfile
      target: runtime
    image: odoo-atlas/atlas:dev
    container_name: atlas-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment: *atlas-environment
    volumes:
      - ./services/atlas/src:/app/src:ro
    command: ["atlas", "worker"]
    healthcheck:
      # The image ships an HTTP liveness probe for the API. A worker serves no
      # HTTP, so it would fail that check forever while working perfectly. There
      # is no useful equivalent either: a polling loop is alive exactly when its
      # process is, which `restart: unless-stopped` already handles.
      disable: true

  # Lint, type-check and test runner. Started only via `--profile tools`, so it
  # never runs as part of the stack. Exists so contributors need no local Python
  # interpreter — see docker/atlas/Dockerfile, stage `dev`.
  atlas-tools:
    build:
      context: .
      dockerfile: docker/atlas/Dockerfile
      target: dev
    image: odoo-atlas/atlas:tools
    profiles: ["tools"]
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      # Required. import-linter resolves `atlas` by importing it, so without this
      # it analyses the copy baked into the image at build time and reports a
      # stale result — a contract can pass while the working tree violates it.
      # pytest and mypy read the source directly, so only this tool depends on it.
      PYTHONPATH: /workspace/services/atlas/src
      # Unit tests need no database; this satisfies fail-fast settings validation
      # for the handful of tests that construct Settings.
      ATLAS_DATABASE__URL: postgresql://atlas:atlas@postgres:5432/atlas
    entrypoint: []
    command: ["pytest"]

volumes:
  postgres-data:
    name: odoo-atlas-postgres-data
  odoo-filestore:
    name: odoo-atlas-odoo-filestore
