# ---------------------------------------------------------------------------
# Repository-level tooling configuration.
#
# This file defines NO package. It is the single source of truth for lint, type,
# test and coverage settings across both Python trees in the monorepo:
#
#   services/atlas/   the engine   — strict typing, full lint set
#   addons/           the Odoo addon (M5) — Odoo's own conventions, relaxed rules
#
# The engine's own package metadata and dependencies live in
# services/atlas/pyproject.toml.
# ---------------------------------------------------------------------------

# =========================== ruff (lint + format) ==========================
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["services/atlas/src", "services/atlas/tests"]
extend-exclude = [".venv", "addons/*/migrations"]

[tool.ruff.lint]
select = [
    "F",     # pyflakes
    "E", "W",# pycodestyle
    "I",     # isort
    "N",     # pep8-naming
    "D",     # pydocstyle
    "UP",    # pyupgrade
    "ANN",   # flake8-annotations
    "ASYNC", # flake8-async
    "S",     # flake8-bandit
    "BLE",   # flake8-blind-except
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez — naive datetimes are a bug magnet in an ERP
    "T20",   # flake8-print — logging, not print()
    "EM",    # flake8-errmsg
    "ISC",   # flake8-implicit-str-concat
    "ICN",   # flake8-import-conventions
    "G",     # flake8-logging-format
    "PIE",   # flake8-pie
    "PT",    # flake8-pytest-style
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
    "TID",   # flake8-tidy-imports
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    "ERA",   # eradicate — commented-out code
    "PL",    # pylint
    "TRY",   # tryceratops
    "RUF",   # ruff-specific
]
ignore = [
    "D203",   # conflicts with D211; we use D211 (no blank line before class docstring)
    "D213",   # conflicts with D212; we use D212 (summary on the first line)
    "D105",   # dunder semantics come from the protocol, not from a restated docstring
    "D107",   # __init__ is documented by its class docstring, not twice
    "COM812", # trailing-comma rules fight the formatter
    "ISC001", # implicit string concat rule fights the formatter
    "TRY003", # long messages inside raise are fine and more readable than constants
]

[tool.ruff.lint.per-file-ignores]
# Tests assert and use magic numbers freely. `D1` (missing-docstring) is off
# because a well-named test function is its own documentation — docstrings are
# still used where a test needs to explain *why*, just never mandated.
"services/atlas/tests/**" = [
    "S101",    # asserting is the point
    "PLR2004", # expected values inline are clearer than named constants
    "D1",      # a well-named test documents itself
    "ARG001",  # fixtures are often requested for their side effect
    # A test double conforms to a port, so it takes the port's arguments whether
    # this particular double reads them or not.
    "ARG002",
    "ANN401",  # test helpers legitimately take **kwargs: Any
    "EM101",   # raising a literal is fine when constructing a failure case
    "TRY301",  # ditto
    "PLC0415", # imports inside a test keep an optional SDK out of collection
    # Fixture tokens are the point of a test about tokens. The rule cannot tell
    # `token="alice-token"` from a leaked credential; a reviewer can.
    "S105",
    "S106",
    "S107",
]
# Adapters implement documented ports. The contract — arguments, guarantees,
# exceptions — is stated once on the Protocol in `atlas.domain.ports`; repeating
# it on every implementation produces docstrings that restate the method name and
# drift from the port they claim to describe. Docstrings are still used here
# wherever an adapter has something of its own to explain.
# Alembic revisions: `upgrade`/`downgrade` are a fixed contract with the tool, and
# the module docstring already says what the revision does. INP001 does not apply —
# the versions directory is loaded by Alembic, not imported as a package.
"services/atlas/migrations/**" = ["D103", "INP001"]
"services/atlas/src/atlas/infrastructure/**" = [
    "D102",
    # Vendor SDK responses are untyped payloads. Converting `Any` into typed
    # domain objects is precisely what an adapter is for, so the boundary is
    # where `Any` belongs.
    "ANN401",
    # An adapter implements somebody else's interface and does not get to choose
    # its signature. Several of ours exist precisely to *refuse* a call, and a
    # refusal that read its arguments first would be stranger than one that
    # does not.
    "ARG002",
]
# The source templates render raw ERP field values, which arrive as whatever
# Odoo felt like sending: a string, a float, `False` for "unset", or a
# `[id, "Name"]` pair. Turning that into text is the whole job of this module,
# so `Any` is the honest type for its input — the same reason it is allowed in
# the adapters above.
"services/atlas/src/atlas/domain/sources.py" = ["ANN401"]
# Odoo addons follow Odoo's conventions, not ours: field definitions are mutable
# class attributes by design, and the framework supplies most docstring context.
# TID252 is off because an addon's `__init__.py` must use relative imports —
# Odoo loads a module as `odoo.addons.<name>`, so the package is not importable
# under its own directory name.
#
# `EM` is off because Odoo and werkzeug exceptions are constructed with their
# message inline — `raise BadRequest("'tool' must be a string")` — and hoisting
# every one to a local would obscure far more than it documents. The engine keeps
# the rule; this is the same carve-out `TRY003` already has repository-wide.
"addons/**" = ["D", "ANN", "RUF012", "A003", "PLR0913", "TID252", "EM"]
# An addon's package files exist to make Odoo import the modules below them.
# Nothing re-exports anything, and the order is Odoo's loading order, not isort's.
"addons/**/__init__.py" = ["F401", "I001"]
# Odoo test cases assert, and they name expected values inline. `PT` is off
# because these run under Odoo's own unittest-based runner, not pytest, so
# `assertRaises` and friends are the correct spelling here.
"addons/**/tests/**" = ["S101", "PLR2004", "PT", "S105", "S106", "S107"]
# The benchmarks are a command-line tool, not a library. They print tables for a
# person to read, and they interpolate a table *identifier* into DDL — composed
# with `psycopg.sql.Identifier`, which is the safe spelling, but S608 matches on
# the f-string shape rather than on what it contains.
"benchmarks/**" = ["T201", "S608"]
# The maintenance scripts are command-line tools. They print findings for a
# person to read, and a check that reported through the logger would be silent
# in the place it matters — a CI log.
"scripts/**" = ["T201"]
# An Odoo manifest is a bare dict literal at module level.
"addons/**/__manifest__.py" = ["B018"]

[tool.ruff.lint.isort]
known-first-party = ["atlas"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
docstring-code-format = true

# ================================== mypy ===================================
[tool.mypy]
python_version = "3.12"
mypy_path = "services/atlas/src"
files = ["services/atlas/src", "services/atlas/tests"]
# Deliberately-wrong code, kept so a test can prove the type checker rejects it.
# See tests/unit/test_authorization_is_structural.py.
exclude = ["services/atlas/tests/fixtures/typing/"]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]
enable_error_code = [
    "ignore-without-code",  # a bare `# type: ignore` hides the next real error
    "redundant-expr",
    "truthy-bool",
    "possibly-undefined",
]

[[tool.mypy.overrides]]
# voyageai re-exports its client without declaring `__all__`, which strict mode
# treats as a private import. The class is public and documented.
module = ["voyageai.*"]
implicit_reexport = true

[[tool.mypy.overrides]]
# The LlamaIndex reader integrations ship no `py.typed`. `llama-index-core` does,
# so only the reader package is untyped — and it is reached from exactly one
# module, which converts its output to `str` immediately (ADR-0003).
module = ["llama_index.readers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The OTLP exporter is an optional extra: it pulls in grpc, and a deployment
# that never traces should not pay for it. The one import of it is guarded by
# `try/except ImportError` and degrades to tracing staying off.
module = ["opentelemetry.exporter.*"]
ignore_missing_imports = true

[tool.semantic_release]
# Determines the *version* from Conventional Commit prefixes, and nothing else.
# The release workflow passes `--no-changelog`: `CHANGELOG.md` is prose, and a
# generated list of commit subjects would replace an explanation with an
# inventory.
version_toml = ["services/atlas/pyproject.toml:project.version"]
tag_format = "v{version}"
major_on_zero = false          # 0.x: a breaking change bumps the minor, not to 1.0
allow_zero_version = true
commit_parser = "conventional"
build_command = ""             # images are built by the workflow, not by this

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.commit_parser_options]
# `perf` earns a release: this project treats a measured latency change as a
# user-visible one (docs/performance.md).
allowed_tags = ["feat", "fix", "perf", "refactor", "docs", "build", "ci", "test", "chore"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ============================== import-linter ==============================
# The layering rules from docs/architecture/01-overview.md, enforced. These are
# the reason the architecture documentation can be trusted: a violation fails the
# build rather than surviving review.
[tool.importlinter]
root_package = "atlas"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is independent of every other layer"
type = "forbidden"
source_modules = ["atlas.domain"]
forbidden_modules = [
    "atlas.application",
    "atlas.infrastructure",
    "atlas.interfaces",
    "atlas.config",
]

[[tool.importlinter.contracts]]
name = "Application depends on ports, never on adapters"
type = "forbidden"
source_modules = ["atlas.application"]
forbidden_modules = [
    "atlas.infrastructure",
    "atlas.interfaces",
    "atlas.config",
]

[[tool.importlinter.contracts]]
# ADR-0002. The engine reaches Odoo over HTTP, never by importing it.
name = "The engine never imports odoo"
type = "forbidden"
source_modules = ["atlas"]
forbidden_modules = ["odoo"]

[[tool.importlinter.contracts]]
# ADR-0003. LlamaIndex is one implementation of ports the domain owns, so it stays
# in one package and is reached through those ports.
name = "LlamaIndex is confined to its adapter package"
type = "forbidden"
source_modules = ["atlas"]
forbidden_modules = ["llama_index"]
ignore_imports = [
    "atlas.infrastructure.llamaindex -> llama_index",
    "atlas.infrastructure.llamaindex -> llama_index.**",
    "atlas.infrastructure.llamaindex.** -> llama_index",
    "atlas.infrastructure.llamaindex.** -> llama_index.**",
]
# The adapter package arrives in M7; until then these exemptions match nothing.
unmatched_ignore_imports_alerting = "none"

# ================================= pytest ==================================
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["services/atlas/tests"]
# `services/atlas` puts `tests.support` on the path so stubs can be shared
# between the adapter unit tests and the contract registrations.
pythonpath = ["services/atlas/src", "services/atlas"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
# The engine is async throughout, so async test functions run without a per-test
# marker. `--strict-markers` still applies to our own markers below.
asyncio_mode = "auto"
markers = [
    "unit: fast and isolated — no network, no database, no API key",
    "integration: requires a real PostgreSQL instance",
    "contract: asserts every adapter of a port behaves identically",
    "live: calls a real provider; needs API keys and costs money. Never on a PR",
    "slow: takes longer than a second",
]
filterwarnings = ["error"]

# ================================ coverage =================================
[tool.coverage.run]
source = ["services/atlas/src/atlas"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Ratcheted as the engine grows: 70 at M1, 85 at M3.
#
# This gate applies to a run that can execute every line — that is, one with a
# database, so the persistence layer is reachable. The offline selection
# (`unit or contract`) opts out with `--cov-fail-under=0`: it cannot reach
# `infrastructure/persistence`, and holding it to a whole-tree number would
# measure the wrong thing.
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
