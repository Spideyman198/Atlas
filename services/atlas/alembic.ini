# Alembic configuration.
#
# `sqlalchemy.url` is deliberately absent: migrations/env.py reads the URL from
# Atlas settings, so there is one source of truth and no credentials in a
# committed file. Override for a one-off with:
#
#     alembic -x url=postgresql://... upgrade head

[alembic]
script_location = migrations
prepend_sys_path = src
# Alembic 1.18 renamed `version_path_separator`. Without it, Alembic falls back to
# splitting paths on spaces, commas and colons and warns about it.
path_separator = os

# Revisions are numbered by hand (0001, 0002, ...) rather than by hash. The
# ordering is the review artefact; a random slug tells a reviewer nothing.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
