  - key: policy-refunds
    res_model: ir.attachment
    res_id: 501
    title: Refund and returns policy
    text: |
      Refund and returns policy, revision 4, effective January 2026.
      Goods may be returned within 30 days of delivery for a full refund,
      provided they are unused and in original packaging. Bespoke and
      made-to-order items are excluded. Refunds are issued to the original
      payment method within 14 days of the return being received.
      Shipping costs are refunded only where the goods were faulty.

  - key: policy-warranty
