# The corpus the golden questions are scored against.
#
# Written out rather than pulled from an Odoo, so `make eval` runs anywhere and
# produces the same number twice. A real ERP makes a better benchmark and a
# worse gate: the corpus moves under you, and a metric that drops because
# somebody confirmed an order tells you nothing about retrieval.
#
# The records are deliberately confusable. Two customers share a first word,
# two orders differ only in status, and the refund policy exists as both a
# document and a sentence inside an unrelated note. Retrieval that scores well
# on a corpus of unrelated paragraphs has not been tested.

