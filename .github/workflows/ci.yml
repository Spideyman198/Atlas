name: CI

# Runs on every pull request and on pushes to main. Nothing here needs a secret,
# an API key or a network call to a model provider — the engine is designed so
# its test suite runs entirely offline (ADR-0005).
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

# A new push to the same branch cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/atlas/pyproject.toml

      - name: Install the engine and its toolchain
        run: pip install -e "services/atlas[dev]"

      - name: ruff (lint)
        run: ruff check --output-format=github .

      - name: ruff (format)
        run: ruff format --check .

      - name: mypy (strict)
        run: mypy

      - name: import-linter (architectural layering)
        run: lint-imports

      # Offline: a file corpus, a deterministic embedder, an in-memory store.
      # No services and no API key, so it can gate a pull request. Exits
      # non-zero when a floor in interfaces/evaluate.py is not cleared.
      - name: Retrieval evaluation (regression gate)
        run: python -m atlas.interfaces.evaluate

  test:
    name: Unit and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/atlas/pyproject.toml

      - name: Install the engine and its toolchain
        run: pip install -e "services/atlas[dev]"

      # Both tiers are offline — no network, no database, no API key — so both run
      # on every push. Excluding `contract` would mean the suite that enforces
      # adapter substitutability never gates a pull request.
      # Coverage is reported, not gated: this selection cannot reach the
      # persistence layer, which needs a database. The integration job below runs
      # every tier and owns the gate.
      - name: pytest
        run: |
          pytest -m "unit or contract" --cov-fail-under=0 \
            --cov --cov-report=term-missing --cov-report=xml --junitxml=junit.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: |
            coverage.xml
            junit.xml
          retention-days: 14

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # The same image the stack runs, so the tests exercise the pgvector
        # version the deployment actually has.
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/atlas/pyproject.toml

      - name: Install the engine and its toolchain
        run: pip install -e "services/atlas[dev]"

      # Creates its own database and runs Alembic against it, so this also
      # verifies the migration applies to an empty cluster.
      #
      # Runs every tier: with a database present this is the only selection that
      # can execute every line, so it is where the coverage gate belongs.
      - name: pytest (all tiers)
        env:
          ATLAS_TEST_DATABASE_URL: postgresql://atlas:atlas@127.0.0.1:5432/postgres
        run: pytest -m "unit or contract or integration" --cov --cov-report=term-missing

  addon:
    name: Odoo addon tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The addon runs under Odoo's own unittest runner, so it needs an Odoo and
      # a database rather than a Python environment. This drives the compose
      # stack rather than a hand-rolled container so that CI, `make test-odoo`
      # and `make up` all build the same image from the same Dockerfile.
      #
      # `run` waits for the postgres service to report healthy, and the database
      # named here does not exist on a fresh runner, so `--init` creates it: a
      # pass means the addon installs from nothing and its tests are green.
      # Odoo exits non-zero when a test fails.
      - name: Install the addon on a clean database and run its tests
        run: |
          docker compose --env-file .env.example run --rm --entrypoint odoo \
            --env PGPASSWORD=odoo_dev_password odoo \
            --db_host postgres --db_port 5432 --db_user odoo \
            --database odoo_atlas_ci --init odoo_atlas --without-demo \
            --test-enable --test-tags /odoo_atlas \
            --stop-after-init --max-cron-threads=0 --log-level=test

      - name: Stop the stack
        if: always()
        run: docker compose --env-file .env.example down --volumes

  images:
    name: Container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the compose file
        # Catches interpolation errors and schema mistakes before anyone runs it.
        run: docker compose --env-file .env.example config --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build the engine image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/atlas/Dockerfile
          target: runtime
          push: false
          load: true
          tags: odoo-atlas/atlas:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the image starts and answers liveness
        # No `--rm`: on failure the container must survive long enough for the
        # log step below to read it. The cleanup step removes it either way.
        #
        # The offline providers are selected explicitly. The composition root
        # builds providers at startup and refuses to start without a key, so a
        # smoke test that only set a database URL would fail by design. The Odoo
        # service token is required for the same reason: Odoo authorises every
        # retrieval, so an engine without one could never clear a candidate.
        # Liveness is what is being checked here — there is no Odoo in this job,
        # and readiness would correctly report that.
        run: |
          docker run --detach --name atlas-ci \
            --env ATLAS_DATABASE__URL=postgresql://atlas:atlas@127.0.0.1:5432/atlas \
            --env ATLAS_CHAT__VENDOR=fake \
            --env ATLAS_CHAT__MODEL=fake-model \
            --env ATLAS_EMBEDDING__VENDOR=hash \
            --env ATLAS_EMBEDDING__MODEL=hash-embedding-v1 \
            --env ATLAS_ODOO__SERVICE_TOKEN=smoke-test-token \
            --publish 8000:8000 odoo-atlas/atlas:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then
              echo "" && echo "liveness ok after ${attempt}s" && exit 0
            fi
            if [ -z "$(docker ps --quiet --filter name=atlas-ci)" ]; then
              echo "engine exited during startup" >&2
              break
            fi
            sleep 1
          done
          echo "engine did not become live" >&2
          exit 1

      - name: Collect engine logs on failure
        if: failure()
        run: docker logs atlas-ci || true

      - name: Stop the container
        if: always()
        run: docker rm --force atlas-ci || true
