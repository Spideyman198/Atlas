; ---------------------------------------------------------------------------
; Odoo server configuration — DEVELOPMENT.
;
; Database connection settings (db_host, db_port, db_user, db_password) are
; deliberately absent. The official Odoo entrypoint injects them from the HOST /
; PORT / USER / PASSWORD environment variables, but only for keys this file does
; not already define. Keeping credentials out of a committed file is the point.
;
; Production deployments mount their own configuration over this path.
; ---------------------------------------------------------------------------
[options]

addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo

; Development-only master password, guarding the database manager UI.
; MUST be overridden in any deployment reachable by anyone but you.
admin_passwd = atlas-dev-only-change-me

; Threaded single-process mode. Required for `--dev` auto-reload and for
; attaching a debugger. Production sets workers > 0 — and because a 20-second
; LLM call never occupies an Odoo worker (ADR-0002), the usual worker sizing
; rules still apply.
workers = 0
max_cron_threads = 1

; Generous development limits. Ingestion cron runs (M7) can be slow on a cold
; corpus, and a request killed mid-sync is harder to debug than a slow one.
limit_time_cpu = 600
limit_time_real = 1200
limit_request = 8192

; Keep the database manager usable for reset and duplicate flows during
; development. Both are tightened in the M14 production overlay.
list_db = True
dbfilter = .*

; Explicit because Odoo 19 warns that the default changes to 127.0.0.1 in 20.0,
; which would make the container unreachable from the host.
http_interface = 0.0.0.0
http_port = 8069

log_level = info
log_handler = :INFO

; Enable when running behind nginx/traefik with X-Forwarded-* headers.
proxy_mode = False
